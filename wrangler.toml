name = "dice-room"
main = "worker/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "DICE_ROOM"
class_name = "DiceRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DiceRoom"]
